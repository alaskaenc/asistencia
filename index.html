<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Asistencia</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <!-- Fuentes Google -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome para íconos del toast -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <!-- Logo de Alaska Fashion -->
      <img 
        src="https://raw.githubusercontent.com/alaskaenc/codigos/6c138c281119ae803524f44e4ad816b269124d75/ALASKA%20FASHION%20-%20PNG%202023%20NEGRO.png"
        alt="Alaska Fashion"
        class="logo"
      >

      <h2>Registro de Asistencia</h2>
     
      <div class="input-wrapper">
        <input
          type="text"
          id="ci"
          placeholder="Ingrese su CI"
          autocomplete="off"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="12"
        >
      </div>

      <div class="buttons">
        <button onclick="marcar('ENTRADA')" class="btn btn-entrada">
          ENTRADA
        </button>
       
        <button onclick="marcar('SALIDA')" class="btn btn-salida">
          SALIDA
        </button>
      </div>
    </div>
  </div>

  <!-- Contenedor para toasts -->
  <div id="toast-container"></div>

  <script src="empleado.js"></script>
</body>
</html>
